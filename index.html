<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lo-Fi Globe · Global Weather Vibes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      :root {
        --bg-deep: #0a0a0f;
        --bg-surface: #12121a;
        --amber-glow: #f59e0b;
        --amber-soft: #fbbf24;
        --purple-mist: #8b5cf6;
        --cyan-accent: #22d3d3;
        --text-primary: #faf5eb;
        --text-muted: #6b7280;
      }
      
      body {
        font-family: 'Outfit', sans-serif;
        background: var(--bg-deep);
        color: var(--text-primary);
        overflow: hidden;
      }
      
      .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1000;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      }
      
      .gradient-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.4;
        animation: float 20s ease-in-out infinite;
      }
      
      .orb-1 {
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, var(--amber-glow) 0%, transparent 70%);
        top: -200px;
        right: -100px;
        animation-delay: 0s;
      }
      
      .orb-2 {
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, var(--purple-mist) 0%, transparent 70%);
        bottom: -150px;
        left: -100px;
        animation-delay: -7s;
      }
      
      .orb-3 {
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, var(--cyan-accent) 0%, transparent 70%);
        top: 50%;
        left: 30%;
        opacity: 0.2;
        animation-delay: -14s;
      }
      
      @keyframes float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(30px, -30px) scale(1.05); }
        66% { transform: translate(-20px, 20px) scale(0.95); }
      }
      
      .mono {
        font-family: 'Space Mono', monospace;
      }
    </style>
  </head>
  <body>
    <div class="noise-overlay"></div>
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
